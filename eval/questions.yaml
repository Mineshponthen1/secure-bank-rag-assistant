  must_contain_any: ["1,000", "1 000", "1000"]

- id: general-number-of-recommendations
  category: general
  user: ABC3
  question: How many FATF Recommendations are there?
  expect: answer
  must_contain_any: ["40", "forty"]

- id: general-risk-based-approach
  category: general
  user: ABC3
  question: What is the risk-based approach?
  expect: answer
  must_contain_any: ["assess", "commensurate", "proportion"]

- id: general-beneficial-ownership
  category: general
  user: ABC2
  question: What information about beneficial ownership should be available to authorities?
  expect: answer
  must_contain_any: ["accurate", "up-to-date", "up to date", "timely"]

- id: general-correspondent-banking
  category: general
  user: ABC2
  question: What measures apply to cross-border correspondent banking?
  expect: answer
  must_contain_any: ["senior management", "sufficient information", "reputation"]

