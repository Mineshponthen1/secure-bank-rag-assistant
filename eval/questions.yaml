  must_contain_any: ["prohibit", "not permitted", "should not", "must not", "not be permitted"]

- id: general-occasional-threshold
  category: general
  user: ABC2
  question: Above what amount must customer due diligence be done for occasional transactions?
  expect: answer
  must_contain_any: ["15,000", "15 000", "15000"]

- id: general-wire-threshold
  category: general
  user: ABC2
  question: What is the threshold for wire transfer information requirements?
