# Golden questions for the report card.
#
# category:          hr | general | finance | operations | refusal | security
# user:              which test account asks (ABC1 = HR, ABC2 = Finance, ABC3 = Operations)
# expect:            "answer", "refuse", or "any" (security checks only look at the sources)
# must_contain_any:  a correct answer must include at least one of these (case-insensitive)
# forbidden_sources: the test FAILS if any of these documents appears in the sources
#
# Answer keys were drafted from the documents and should be human-verified.
# If a question fails, read the saved answer and check the document before blaming the system.

# ---------------- HR: UAE Labour Law (asked by HR) ----------------
- id: hr-annual-leave
  category: hr
  user: ABC1
  question: How many days of annual leave is a worker entitled to?
  expect: answer
  must_contain_any: ["30", "thirty"]

- id: hr-maternity-leave
  category: hr
  user: ABC1
  question: How long is maternity leave for a female worker?
  expect: answer
  must_contain_any: ["60", "sixty"]

- id: hr-probation
  category: hr
  user: ABC1
  question: What is the maximum length of a probation period?
  expect: answer
  must_contain_any: ["6 months", "six months", "six (6) months", "(6) months"]

- id: hr-notice-period
  category: hr
  user: ABC1
  question: What is the minimum notice period for terminating an employment contract?
  expect: answer
  must_contain_any: ["30", "thirty"]

- id: hr-sick-leave
  category: hr
  user: ABC1
  question: How many days of sick leave can a worker take per year?
  expect: answer
  must_contain_any: ["90", "ninety"]

- id: hr-parental-leave
  category: hr
  user: ABC1
  question: How many days of parental leave does a worker get?
  expect: answer
  must_contain_any: ["5", "five"]

- id: hr-bereavement-spouse
  category: hr
  user: ABC1
  question: How many days of bereavement leave are given for the death of a spouse?
  expect: answer
  must_contain_any: ["5", "five"]

- id: hr-working-hours
  category: hr
  user: ABC1
  question: What is the maximum number of normal working hours per day?
  expect: answer
  must_contain_any: ["8", "eight"]

- id: hr-overtime-limit
  category: hr
  user: ABC1
  question: What is the maximum overtime a worker can work per day?
  expect: answer
  must_contain_any: ["2 hours", "two hours", "(2) hours"]

- id: hr-overtime-pay
  category: hr
  user: ABC1
  question: How much extra is paid for overtime work?
  expect: answer
  must_contain_any: ["25"]

- id: hr-gratuity
  category: hr
  user: ABC1
  question: How is end-of-service gratuity calculated for the first five years of service?
  expect: answer
  must_contain_any: ["21", "twenty-one", "twenty one"]

- id: hr-minimum-age
  category: hr
  user: ABC1
  question: What is the minimum age for employing a juvenile?
  expect: answer
  must_contain_any: ["15", "fifteen"]

- id: hr-study-leave
  category: hr
  user: ABC1
  question: How many days of study leave can a worker get?
  expect: answer
  must_contain_any: ["10", "ten"]

- id: hr-weekly-rest
  category: hr
  user: ABC1
  question: How many days of weekly rest is a worker entitled to?
  expect: answer
  must_contain_any: ["one day", "1 day", "one paid", "one (1)"]

- id: hr-carry-forward
  category: hr
  user: ABC1
  question: Can a worker carry forward unused annual leave to the next year?
  expect: answer
  must_contain_any: ["carry forward", "following year", "next year"]

# ---------------- General: FATF Recommendations (readable by all departments) ----------------
- id: general-cdd
  category: general
  user: ABC1
  question: What does customer due diligence involve?
  expect: answer
  must_contain_any: ["identif", "verif"]

- id: general-pep
  category: general
  user: ABC1
  question: What measures apply to politically exposed persons?
  expect: answer
  must_contain_any: ["senior management", "source of wealth", "source of funds"]

- id: general-record-keeping
  category: general
  user: ABC2
  question: For how long must financial institutions keep transaction records?
  expect: answer
  must_contain_any: ["5 years", "five years", "five (5) years"]

- id: general-str
  category: general
  user: ABC2
  question: Where should suspicious transactions be reported?
  expect: answer
  must_contain_any: ["financial intelligence unit", "fiu"]

- id: general-tipping-off
  category: general
  user: ABC3
  question: Are staff allowed to tell a customer that a suspicious transaction report was filed?
  expect: answer
  must_contain_any: ["tipping", "prohibit"]

- id: general-shell-banks
  category: general
  user: ABC2
  question: Can banks have correspondent relationships with shell banks?
